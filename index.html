<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="todo-card shadow-sm">
            <h1 class="text-center mb-4">My To-Do List</h1>

            <form id="todo-form" class="mb-4">
              <div class="task-input-row">
                <input
                  id="task-input"
                  type="text"
                  class="form-control task-input"
                  placeholder="Enter a task..."
                  aria-label="Task input"
                />
                <button type="submit" class="btn btn-primary add-btn">Add Task</button>
              </div>

              <div class="task-datetime-row">
                <div class="date-group">
                  <label for="task-date" class="form-label small-label">Date</label>
                  <input id="task-date" type="date" class="form-control" />
                </div>
                <div class="time-group">
                  <label for="task-time" class="form-label small-label">Time</label>
                  <input id="task-time" type="time" class="form-control" />
                </div>
              </div>
            </form>

            <div id="task-list" class="list-group"></div>

            <div class="d-flex justify-content-between align-items-center mt-4 task-footer">
              <p id="task-count" class="mb-0 fw-semibold">0 tasks remaining</p>
              <button id="clear-completed" type="button" class="btn btn-outline-secondary btn-sm clear-btn">
                Clear Completed
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
